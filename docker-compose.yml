name: starforge-staff

services:
  staff:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DATA_SOURCE: remote
    image: "${STAFF_IMAGE:-starforge-staff:1.0.0}"
    environment:
      API_UPSTREAM: "${API_UPSTREAM:?Set API_UPSTREAM to the verified HTTPS tenant backend origin}"
    user: "101:101"
    ports:
      - "${STAFF_BIND:-127.0.0.1}:${STAFF_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=24m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
