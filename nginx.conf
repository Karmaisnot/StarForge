worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    log_format staff '$remote_addr [$time_iso8601] '
                     '"$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time '
                     'request_id=$http_x_request_id';
    access_log /dev/stdout staff;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    server_tokens off;

    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header_inherit merge;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), display-capture=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep the browser session same-origin and preserve the exact /api URI.
        location /api/ {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ssl_server_name on;
            proxy_ssl_name ${API_UPSTREAM_HOST};
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        location /ws/ {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_ssl_server_name on;
            proxy_ssl_name ${API_UPSTREAM_HOST};
            proxy_set_header Host $proxy_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 65s;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /favicon.svg {
            expires 7d;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
